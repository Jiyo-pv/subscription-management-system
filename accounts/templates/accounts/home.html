<!DOCTYPE html>
<html>
<head>
    <title>Brightloop</title>
</head>

<body>

<h1>Brightloop Subscription Management</h1>

{% if user.is_authenticated %}

    <p>Welcome, {{ user.name }}!</p>
    <p>Role: {{ user.role }}</p>

    <a href="{% url 'logout' %}">Logout</a>

{% else %}

    <a href="{% url 'login' %}">Login</a>
    <a href="{% url 'signup' %}">Signup</a>

{% endif %}

</body>
</html>
