{% extends "accounts/base.html" %}
{% block title %}Check your email | Brightloop{% endblock %}
{% block content %}
<section class="mx-auto max-w-md px-5 py-20 text-center lg:py-28"><div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-emerald-100 text-2xl text-emerald-600">✓</div><h1 class="mt-6 text-3xl font-bold tracking-tight">Check your inbox</h1><p class="mt-3 leading-7 text-slate-500">If an account exists with that email address, we’ve sent a password reset link. It may take a few minutes to arrive.</p><a href="{% url 'login' %}" class="mt-8 inline-block rounded-xl bg-brand-600 px-5 py-3 font-semibold text-white transition hover:bg-brand-700">Return to log in</a></section>
{% endblock %}
