{% extends "accounts/base.html" %}
{% block title %}Reset password | Brightloop{% endblock %}
{% block content %}
<section class="mx-auto max-w-md px-5 py-16 lg:py-24">
    <div class="mb-8 text-center"><div class="mx-auto mb-5 flex h-12 w-12 items-center justify-center rounded-2xl bg-brand-100 text-xl text-brand-700">✦</div><h1 class="text-3xl font-bold tracking-tight">Reset your password</h1><p class="mt-2 text-slate-500">Enter your email and we’ll send you a secure reset link.</p></div>
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8"><form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit" class="mt-2 w-full rounded-xl bg-brand-600 px-4 py-3 font-semibold text-white transition hover:bg-brand-700">Send reset link</button></form><a href="{% url 'login' %}" class="mt-6 block text-center text-sm font-semibold text-slate-500 hover:text-brand-600">← Back to log in</a></div>
</section>
{% endblock %}
