{% if page_obj and page_obj.paginator.num_pages > 1 %}<nav class="mt-5 flex items-center justify-between text-sm"><span class="text-slate-500">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span><div class="flex gap-2">{% if page_obj.has_previous %}<a class="rounded-lg border bg-white px-3 py-2" href="?page={{ page_obj.previous_page_number }}{% if search %}&q={{ search|urlencode }}{% endif %}">Previous</a>{% endif %}{% if page_obj.has_next %}<a class="rounded-lg border bg-white px-3 py-2" href="?page={{ page_obj.next_page_number }}{% if search %}&q={{ search|urlencode }}{% endif %}">Next</a>{% endif %}</div></nav>{% endif %}
