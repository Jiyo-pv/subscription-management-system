{% extends "accounts/base.html" %}
{% block title %}Delete {{ product.name }} | Brightloop{% endblock %}
{% block content %}
<section class="relative isolate overflow-hidden px-5 py-12 lg:py-20">
    <div class="hero-grid absolute inset-0 -z-10 opacity-60"></div>
    <div class="mx-auto max-w-lg animate-in text-center">
        <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-2xl bg-rose-100 text-2xl text-rose-600">!</div>
        <h1 class="font-display text-3xl font-bold text-ink">Delete product</h1>
        <p class="mt-3 text-slate-500">Are you sure you want to delete <strong class="text-ink">{{ product.name }}</strong>? This action cannot be undone.</p>
        <div class="mt-8 flex justify-center gap-3">
            <a href="{% url 'product_detail' product.pk %}" class="rounded-xl border border-slate-200 bg-white px-5 py-3 font-semibold text-slate-700 shadow-sm transition hover:bg-slate-50">Cancel</a>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="rounded-xl bg-rose-600 px-5 py-3 font-semibold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-rose-700">Yes, delete product</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
