{% extends "accounts/base.html" %}{% block title %}Subscribe | Brightloop{% endblock %}{% block content %}<section class="mx-auto max-w-xl px-5 py-16"><div class="rounded-2xl border bg-white p-7"><h1 class="text-3xl font-bold">Subscribe to {{ plan.name }}</h1><p class="mt-3 text-slate-600">{{ plan.price }} / {{ plan.get_billing_period_display|lower }}{% if plan.product %} · {{ plan.product.name }}{% endif %}</p><form method="post" class="mt-6">{% csrf_token %}<button class="rounded-xl bg-ink px-5 py-3 font-semibold text-white">Confirm subscription</button> <a href="{% url 'pricing_page' %}" class="px-3">Back</a></form></div></section>{% endblock %}
